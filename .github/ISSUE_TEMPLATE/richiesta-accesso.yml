name: Richiesta di accesso / Access request
description: Chiedi l'accesso al repository privato di T_MINIs / Request access to the private T_MINIs repository
title: "Richiesta di accesso / Access request"
assignees:
  - davidepatch
body:
  - type: markdown
    attributes:
      value: |
        **Questa richiesta è pubblica.** Non scrivere indirizzi email, numeri di telefono o altri dati personali oltre a quelli chiesti qui sotto.
        **This request is public.** Do not include email addresses, phone numbers or any personal data beyond what is asked below.

        T_MINIs è distribuito con la licenza [PolyForm Strict 1.0.0](https://polyformproject.org/licenses/strict/1.0.0): è consentito usarlo solo per scopi non commerciali, e non è consentito ridistribuirlo, nemmeno in parte, né modificarlo senza il permesso dell'autore.
        T_MINIs is distributed under the [PolyForm Strict License 1.0.0](https://polyformproject.org/licenses/strict/1.0.0): it may be used for noncommercial purposes only, and it may not be redistributed, in whole or in part, or modified without the author's permission.
  - type: input
    id: username
    attributes:
      label: Username GitHub / GitHub username
      description: L'account che riceverà l'invito, di solito quello con cui stai scrivendo. / The account that will receive the invitation, usually the one you are using now.
      placeholder: es. / e.g. mario-rossi
    validations:
      required: true
  - type: input
    id: nome
    attributes:
      label: Nome e cognome / Full name
    validations:
      required: true
  - type: input
    id: istituzione
    attributes:
      label: Istituzione e laboratorio / Institution and lab
      placeholder: es. / e.g. Università di Torino, laboratorio di ...
    validations:
      required: true
  - type: textarea
    id: uso
    attributes:
      label: Uso previsto / Intended use
      description: Per quale progetto o analisi vuoi usare T_MINIs? / What project or analysis would you use T_MINIs for?
    validations:
      required: true
  - type: checkboxes
    id: condizioni
    attributes:
      label: Condizioni d'uso / Terms of use
      options:
        - label: "Ho letto la licenza PolyForm Strict 1.0.0 e userò T_MINIs solo per scopi non commerciali, senza ridistribuirlo né modificarlo senza il permesso dell'autore. / I have read the PolyForm Strict License 1.0.0 and will use T_MINIs for noncommercial purposes only, without redistributing or modifying it without the author's permission."
          required: true
